name: Records Service CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "records-service/**"
      - ".github/workflows/records.yml"

jobs:

  continuous-integration:
    name: Continuous Integration - Records
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r records-service/requirements.txt

      - name: Run Records Service tests
        working-directory: records-service
        run: |
          python test_page.py


  build-and-push:
    name: Build and Push Records Image
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./records-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest


  deploy-to-aws:
    name: Deploy Records Service to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker network inspect student-network >/dev/null 2>&1 || docker network create student-network

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest

            docker rm -f records-service || true

            docker run -d \
              --name records-service \
              --network student-network \
              -p 5002:5000 \
              -e REGISTRATION_SERVICE_URL=http://registration-service:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest