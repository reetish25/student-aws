name: Records Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "records-service/**"
      - ".github/workflows/records.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Records Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest ./records-service

      - name: Push Records Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Records Service to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest
            docker rm -f records-service || true
            docker run -d \
              --name records-service \
              --network student-network \
              -p 5002:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest