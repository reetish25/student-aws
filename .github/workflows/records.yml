name: Records Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "records-service/**"
      - ".github/workflows/records.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Records Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest ./records-service

      - name: Push Records Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/records-service:latest