name: Registration Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "*.txt"
      - "Dockerfile"
      - "templates/**"
      - "static/**"
      - ".github/workflows/registration.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Registration Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/registration-service:latest .

      - name: Push Registration Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/registration-service:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Registration Service to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/registration-service:latest
            docker rm -f registration-service || true
            docker run -d \
              --name registration-service \
              --network student-network \
              -p 5001:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/registration-service:latest