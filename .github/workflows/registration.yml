name: Registration Service CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "app.py"
      - "requirements.txt"
      - "templates/**"
      - "static/**"
      - "create_database.py"
      - "test_html.py"
      - "Dockerfile"
      - ".github/workflows/registration.yml"

jobs:

  continuous-integration:
    name: Continuous Integration - Registration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          python create_database.py

      - name: Run Registration Service tests
        run: |
          python test_html.py


  build-and-push:
    name: Build and Push Registration Image
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/registration-service:latest


  deploy-to-aws:
    name: Deploy Registration Service to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker network inspect student-network >/dev/null 2>&1 || docker network create student-network

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/registration-service:latest

            docker rm -f registration-service || true

            docker run -d \
              --name registration-service \
              --network student-network \
              -p 5001:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/registration-service:latest